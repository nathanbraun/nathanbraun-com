<style>
/* Layout: a scorebook grid — domains run down as rows, levels 1–5 run across as columns;
   a detail panel sits beside it on wide screens and below it on phones. */
:root {
  --paper: #f4f6f3;
  --card: #ffffff;
  --ink: #18221d;
  --muted: #5d6a63;
  --rule: #d5dbd6;
  --navy: #1f3a68;
  --gold: #b8862b;
  --gold-soft: #f3e6c8;
  --navy-soft: #e3e9f3;
  --locked: #a3aea8;
  --hi: #fff3d1;
  --d1: #1f3a68; --d2: #5b6b7a; --d3: #b4472f; --d4: #2f7a5a; --d5: #8a5a9e; --d6: #b8862b; --d7: #2b7f9e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1; letter-spacing: 0.01em; margin: 0; text-transform: uppercase; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.tally { display: flex; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.tally button {
  font: inherit; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center;
}
.tally button[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.tally b { font-family: var(--display); font-size: 1.15rem; font-weight: 600; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar input {
  font: inherit; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink);
  flex: 1 1 220px; min-width: 0;
}
.toolbar .hint { color: var(--muted); font-size: 12px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }
.tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.tabs button { font: inherit; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  padding: 7px 14px; border: none; background: var(--card); color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--navy); color: var(--card); }
.mapwrap { border: 1px solid var(--rule); border-radius: 8px; background: var(--card); overflow: hidden; position: relative; }
.mapwrap svg { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
.mapwrap .maphint { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--muted); background: var(--card); padding: 2px 6px; border-radius: 4px; }
.edge { stroke: var(--rule); stroke-width: 1; fill: none; }
.edge.anc { stroke: var(--gold); stroke-width: 1.8; }
.edge.dep { stroke: var(--navy); stroke-width: 1.8; }
.edge.faded { opacity: 0.15; }
.node { cursor: pointer; }
.node circle { stroke-width: 2; }
.node.locked circle { fill: var(--card); stroke-opacity: 0.45; }
.node.available circle { fill: var(--card); }
.node.dim { opacity: 0.2; }
.node.faded { opacity: 0.3; }
.node.selected circle { stroke: var(--ink); stroke-width: 3; }
.node text { font-family: var(--body); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; opacity: 0; pointer-events: none; }
.node:hover text, .node.lit text, .node:focus-visible text { opacity: 1; }
.node:focus-visible circle { stroke: var(--ink); stroke-width: 3; }
.axis { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; font-weight: 600; fill: var(--muted); }
.band { fill: var(--paper); }
.dlegend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.dlegend span { display: inline-flex; align-items: center; gap: 6px; }
.dlegend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.board { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); vertical-align: top; padding: 8px; }
th:last-child, td:last-child { border-right: none; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: none; }
thead th {
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.85rem;
  color: var(--muted); text-align: left; background: var(--paper);
}
thead th span { display: block; font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; }
tbody th {
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.95rem;
  text-align: left; width: 130px; background: var(--paper);
}
tbody th small { display: block; font-family: var(--mono); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 11px; margin-top: 2px; }
.cell { display: flex; flex-direction: column; gap: 5px; }
.chip {
  font: inherit; font-size: 12.5px; line-height: 1.3; text-align: left; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; align-items: start;
  padding: 5px 7px; border-radius: 5px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
}
.chip:hover { border-color: var(--navy); }
.chip:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.chip.locked { color: var(--muted); }
.chip.dim { opacity: 0.28; }
.chip.ancestor { background: var(--hi); border-color: var(--gold); }
.chip.dependent { background: var(--navy-soft); border-color: var(--navy); }
.chip.selected { box-shadow: 0 0 0 2px var(--navy); border-color: var(--navy); }
.dia { width: 11px; height: 11px; margin-top: 3px; transform: rotate(45deg); border: 1.5px solid var(--locked); }
.dia.available { border-color: var(--navy); }
.dia.in_progress { border-color: var(--gold); background: linear-gradient(135deg, var(--gold) 50%, transparent 50%); }
.dia.mastered { border-color: var(--gold); background: var(--gold); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid; }
aside {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 24px); overflow: auto;
}
@media (max-width: 980px) { aside { position: static; max-height: none; } }
aside .eyebrow { font-family: var(--mono); font-size: 11px; color: var(--muted); }
aside h2 { font-family: var(--display); font-size: 1.6rem; line-height: 1.05; margin: 0; font-weight: 700; text-wrap: balance; }
aside p { margin: 0; }
aside h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.85rem; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 5px; }
.links button {
  font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  border-radius: 4px; padding: 3px 7px; display: inline-flex; gap: 6px; align-items: center;
}
.links .none { color: var(--muted); font-size: 12px; }
.status-set { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.status-set button {
  font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  border-radius: 5px; padding: 6px 4px;
}
.status-set button[aria-pressed="true"] { background: var(--navy); color: var(--card); border-color: var(--navy); }
.sources { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.sources a { color: var(--navy); overflow-wrap: anywhere; }
.empty { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ghost { font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 5px; padding: 6px 10px; }
.note { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .chip { transition: background-color .15s, opacity .15s, border-color .15s; } }
</style>

<script>
const GRAPH = {"meta": {"title": "Baseball Analytics Knowledge Graph", "description": "Prerequisite graph from sabermetric fundamentals to the late-2026 public frontier.", "version": "0.2.1", "updated": "2026-11-02"}, "domains": [{"id": "metrics", "title": "Run value & core metrics"}, {"id": "toolkit", "title": "Data & statistical toolkit"}, {"id": "hitting", "title": "Hitting"}, {"id": "pitching", "title": "Pitching"}, {"id": "defense", "title": "Defense, catching & baserunning"}, {"id": "strategy", "title": "Game strategy"}, {"id": "valuation", "title": "Projection & player valuation"}], "nodes": [{"id": "run_environment", "title": "Run environment and league context", "domain": "metrics", "level": 1, "summary": "Know that the value of every event depends on league-wide scoring (runs/game, HR and K rates by era and season) and that metrics must be re-baselined each season.", "prerequisites": [], "sources": [{"title": "FanGraphs Library - Converting Runs to Wins", "url": "https://library.fangraphs.com/misc/war/converting-runs-to-wins"}, {"title": "FanGraphs Library - Expected Wins and Losses", "url": "https://library.fangraphs.com/principles/expected-wins-and-losses"}], "status": "not_started"}, {"id": "run_expectancy", "title": "Run expectancy matrix (24 base-out states)", "domain": "metrics", "level": 1, "summary": "Build the RE matrix from play-by-play by averaging runs scored from each base-out state to the end of the inning, and use it to value any change of state. Summing those changes over a player's plate appearances gives RE24, which credits situational context that linear weights deliberately strip out.", "prerequisites": ["run_environment", "retrosheet_chadwick"], "sources": [{"title": "FanGraphs Library - RE24", "url": "https://library.fangraphs.com/misc/re24"}, {"title": "Baseball-Reference - Win Expectancy and Run Expectancy", "url": "https://baseball-reference.com/about/wpa.shtml"}, {"title": "FanGraphs - Get to Know RE24", "url": "https://blogs.fangraphs.com/get-to-know-re24/"}], "status": "not_started"}, {"id": "baseruns", "title": "BaseRuns and non-linear team run estimators", "domain": "metrics", "level": 2, "summary": "Understand BaseRuns (baserunners x score rate + HR) as a dynamic run estimator that stays sensible at extreme team contexts where linear weights fail, and how linear weights can be read off it as partial derivatives.", "prerequisites": ["linear_weights"], "sources": [{"title": "Tango wiki archive - Base Runs", "url": "https://tangotiger.net/wiki_archive/Base_Runs.html"}, {"title": "FanGraphs - Linear Weights + BaseRuns = Good", "url": "https://blogs.fangraphs.com/linear-weights-baseruns-good/"}], "status": "not_started"}, {"id": "count_run_values", "title": "Pitch-level and count-based run values", "domain": "metrics", "level": 2, "summary": "Extend linear weights down to the pitch by valuing each ball-strike count, so every pitch gets a delta run expectancy (Statcast delta_run_exp, pitch-type linear weights, swing/take run value).", "prerequisites": ["linear_weights", "statcast_data", "run_expectancy"], "sources": [{"title": "FanGraphs - Pitch Type Linear Weights", "url": "https://blogs.fangraphs.com/pitch-type-linear-weights/"}, {"title": "Baseball Savant - Swing/Take Run Value leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/swing-take"}, {"title": "Baseball Savant changelog - context-neutral run values default (Mar 2025)", "url": "https://baseballsavant.mlb.com/changelog/2025-03-11-batted-ball-profile-run-value"}, {"title": "Baseball Savant - Pitch Arsenal Stats (run value by pitch type)", "url": "https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats"}], "status": "not_started"}, {"id": "dips_theory", "title": "DIPS theory and BABIP luck", "domain": "metrics", "level": 2, "summary": "Understand why pitchers have weak control over balls in play (BABIP regresses heavily) while K, BB and HR are more persistent, and the caveats discovered since McCracken.", "prerequisites": ["linear_weights", "regression_to_mean"], "sources": [{"title": "FanGraphs Library - DIPS", "url": "https://library.fangraphs.com/principles/dips"}], "status": "not_started"}, {"id": "linear_weights", "title": "Linear weights", "domain": "metrics", "level": 2, "summary": "Derive each event's average run value by averaging RE changes across all occurrences of the event, then rebase relative to an out; know when additivity breaks down.", "prerequisites": ["run_expectancy"], "sources": [{"title": "FanGraphs Library - Linear Weights", "url": "https://library.fangraphs.com/principles/linear-weights"}, {"title": "Stanford STATS 50 - Derivation of wOBA", "url": "https://web.stanford.edu/class/stats50/files/STATS_50_Derivation_of_the_wOBA.pdf"}], "status": "not_started"}, {"id": "park_factors", "title": "Park factors", "domain": "metrics", "level": 2, "summary": "Estimate park effects (runs and component-level, by handedness) from home/road comparisons over multi-year windows, regress them, and know the difference from Statcast's batted-ball-based park factors.", "prerequisites": ["run_environment", "regression_to_mean", "ball_weather_physics"], "sources": [{"title": "Baseball Savant - Statcast Park Factors", "url": "https://baseballsavant.mlb.com/leaderboard/statcast-park-factors"}, {"title": "MLB.com - A new way to dissect baseball's park factors", "url": "https://www.mlb.com/news/park-factors-measured-by-statcast"}, {"title": "FanGraphs - Park factors added to Guts", "url": "https://blogs.fangraphs.com/park-factors-added-to-fangraphs-guts"}], "status": "not_started"}, {"id": "runs_to_wins", "title": "Runs-to-wins conversion (Pythagorean / Pythagenpat)", "domain": "metrics", "level": 2, "summary": "Map run differential to wins via Pythagorean-style estimators with an environment-dependent exponent, yielding the roughly-10-runs-per-win rule and why it moves with scoring.", "prerequisites": ["run_environment"], "sources": [{"title": "FanGraphs Library - Converting R me-through-and-exertion-levels"}], "status": "not_started"}, {"id": "exit_velocity_launch_angle", "title": "Exit Velocity and Launch Angle", "domain": "hitting", "level": 1, "summary": "The two primary Statcast batted-ball measurements (ball speed off the bat and vertical launch angle) and why their joint distribution, not either one alone, determines outcome value.", "prerequisites": ["statcast_data"], "sources": [{"title": "MLB Glossary: Sweet Spot (launch-angle band definitions)", "url": "https://www.mlb.com/glossary/statcast/sweet-spot"}, {"title": "FanGraphs: Which Hitters Benefit From Pulling? (Clemens, 2024)", "url": "https://blogs.fangraphs.com/which-hitters-benefit-from-pulling"}], "status": "not_started"}, {"id": "plate_discipline", "title": "Plate Discipline Rates", "domain": "hitting", "level": 1, "summary": "Zone-conditioned swing and contact rates (O-Swing/chase, Z-Swing, O-/Z-Contact, SwStr/whiff, Zone%) and simple composites like Z-minus-O swing rate.", "prerequisites": ["statcast_data"], "sources": [{"title": "FanGraphs Library: Plate Discipline (O-Swing%, Z-Swing%, etc.)", "url": "https://library.fangraphs.com/offense/plate-discipline"}, {"title": "FanGraphs Community: Is Z-O Swing% a Better Indicator of Plate Discipline Than O-Swing%?", "url": "https://community.fangraphs.com/is-z-o-swing-a-better-indicator-of-plate-discipline-than-o-swing"}], "status": "not_started"}, {"id": "spray_angle_direction", "title": "Spray Angle and Batted-Ball Direction", "domain": "hitting", "level": 1, "summary": "Horizontal direction of a batted ball (pull / center / oppo), how it interacts with launch angle, and why direction carries value that EV/LA-only models miss.", "prerequisites": ["statcast_data"], "sources": [{"title": "FanGraphs: The Pulled Fly Ball Revolution Was Always Underway (Chamberlain, 2024)", "url": "https://blogs.fangraphs.com/the-pulled-fly-ball-revolution-was-always-underway"}], "status": "not_started"}, {"id": "bat_tracking", "title": "Bat Tracking Basics (Bat Speed, Swing Length)", "domain": "hitting", "level": 2, "summary": "Hawk-Eye bat tracking (2H 2023 onward) - bat speed at the sweet spot averaged over competitive swings, fast-swing rate (75+ mph), and swing length (3D path distance of the bat head to contact), plus their known confounds.", "prerequisites": ["statcast_data", "reliability_stabilization"], "sources": [{"title": "Baseball Savant: Bat Tracking Leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/bat-tracking"}, {"title": "FanGraphs: What Statcast's New Bat Tracking Data Does and Doesn't Tell Us (Clemens, 2024)", "url": "https://blogs.fangraphs.com/what-statcasts-new-bat-tracking-data-does-and-doesnt-tell-us"}, {"title": "Baseball Savant changelog - Swing Path & Attack Angle (May 2025)", "url": "https://baseballsavant.mlb.com/changelog/2025-05-20-swing-path-attack-angle"}, {"title": "MLB.com - 4 new swing metrics", "url": "https://www.mlb.com/news/new-statcast-swing-metrics-2025"}], "status": "not_started"}, {"id": "batted_ball_quality", "title": "Batted-Ball Quality Classes (Hard-Hit, Sweet Spot, Barrels)", "domain": "hitting", "level": 2, "summary": "Threshold-based contact classifications - hard-hit (95+ mph), sweet spot (8-32 deg LA), and barrels (98+ mph with a widening EV-dependent LA window tied to .500 AVG / 1.500 SLG) - and their run value.", "prerequisites": ["exit_velocity_launch_angle", "woba"], "sources": [{"title": "MLB Glossary: Barrel", "url": "https://www.mlb.com/glossary/statcast/barrel"}, {"title": "MLB Glossary: Sweet Spot", "url": "https://www.mlb.com/glossary/statcast/sweet-spot"}], "status": "not_started"}, {"id": "ev50_best_speed", "title": "Batted-ball distribution summaries (EV50, launch-angle tightness)", "domain": "hitting", "level": 2, "summary": "Summarize a hitter's batted-ball distribution rather than its mean: EV50 (average of the hardest half of batted balls) predicts future damage better than mean exit velocity, and the spread of launch angles is a bat-control signal tied to steadier contact quality.", "prerequisites": ["exit_velocity_launch_angle", "regression_to_mean"], "sources": [{"title": "What is EV50 and what does it mean for the Reds?", "url": "https://redscontentplus.com/2024/05/what-is-ev50-and-what-does-it-mean-for-the-reds/"}, {"title": "FanGraphs: Which Hitters Benefit From Pulling? (best speed vs pull rate)", "url": "https://blogs.fangraphs.com/which-hitters-benefit-from-pulling"}, {"title": "FanGraphs: Let's Talk About Launch Angle Tightness (Chamberlain, 2019)", "url": "https://fantasy.fangraphs.com/lets-talk-about-launch-angle-tightness/"}, {"title": "FanGraphs: Musings at the Intersection of Launch Angle Consistency and Hard-Hit Rate", "url": "https://blogs.fangraphs.com/musings-at-the-intersection-of-launch-angle-consistency-and-hard-hit-rate"}], "status": "not_started"}, {"id": "squared_up_blasts_swords", "title": "Collision efficiency: squared-up rate and blasts", "domain": "hitting", "level": 2, "summary": "Squared-up rate compares actual exit velocity to the maximum achievable given bat and pitch speed (80% or more counts), and blasts require squared-up rate x 100 + bat speed of at least 164.", "prerequisites": ["bat_tracking", "exit_velocity_launch_angle"], "sources": [{"title": "MLB Glossary: Squared-up Rate", "url": "https://www.mlb.com/glossary/statcast/squared-up"}, {"title": "MLB Glossary: Blasts", "url": "https://www.mlb.com/glossary/statcast/bat-tracking-blasts"}, {"title": "MLB Glossary: Sword", "url": "https://www.mlb.com/glossary/statcast/sword"}], "status": "not_started"}, {"id": "swing_take_run_value", "title": "Swing/Take Run Value by Attack Zone", "domain": "hitting", "level": 2, "summary": "Splitting pitches into heart / shadow / chase / waste regions and crediting swings and takes with count-based run-expectancy changes, as in Savant's swing-take leaderboard.", "prerequisites": ["plate_discipline", "run_expectancy"], "sources": [{"title": "Baseball Savant: Statcast Run Value (Swing/Take) Leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/swing-take?group=Pitcher"}, {"title": "FanGraphs: Forget MeatWaste, Who's Crushing Shadowballs?", "url": "https://blogs.fangraphs.com/forget-meatwaste-whos-crushing-shadowballs"}], "status": "not_started"}, {"id": "contact_power_tradeoff", "title": "Contact vs Power Tradeoff", "domain": "hitting", "level": 3, "summary": "Faster, longer, steeper swings buy damage at the cost of whiffs (and vice versa); quantifying the exchange rate in runs across hitters and counts (e.g. two-strike shortening).", "prerequisites": ["bat_tracking", "swing_path_metrics", "plate_discipline", "batted_ball_quality"], "sources": [{"title": "Examining Swing Path Tilt (Salorio, 2025)", "url": "https://adamsalorio.substack.com/p/examining-swing-path-tilt"}, {"title": "FanGraphs: What Statcast's New Bat Tracking Data Does and Doesn't Tell Us", "url": "https://blogs.fangraphs.com/what-statcasts-new-bat-tracking-data-does-and-doesnt-tell-us"}], "status": "not_started"}, {"id": "intercept_point_stance", "title": "Batting Stance and Intercept (Contact) Point", "domain": "hitting", "level": 3, "summary": "Stance geometry (depth in box, distance off plate, width, open or closed angle) and where contact occurs relative to the hitter's center of mass: the average home run is hit about 36 inches out front, and 82% of home runs come between 25 and 45 inches out front.", "prerequisites": ["bat_tracking"], "sources": [{"title": "MLB Glossary: Intercept Point", "url": "https://www.mlb.com/glossary/statcast/intercept-point"}, {"title": "MLB Glossary: Batting Stance", "url": "https://www.mlb.com/glossary/statcast/batting-stance"}, {"title": "MLB.com: The secret to doing damage as a hitter? It lies in the point of contact (Petriello, 2025)", "url": "https://www.mlb.com/news/why-batters-do-damage-when-they-hit-the-ball-out-front"}], "status": "not_started"}, {"id": "pull_air_approach", "title": "Pull-Air Approach", "domain": "hitting", "level": 3, "summary": "Pulled fly balls are by far the most valuable batted-ball type (~.900+ wOBAcon), are under-credited by xwOBA, and are hard to produce; evaluating pull-air rate as a hitter skill and development target.", "prerequisites": ["spray_angle_direction", "expected_stats"], "sources": [{"title": "FanGraphs: The Pulled Fly Ball Revolution Was Always Underway (Chamberlain, 2024)", "url": "https://blogs.fangraphs.com/the-pulled-fly-ball-revolution-was-always-underway"}, {"title": "FanGraphs: A Meandering Examination of Fly Ball Pull Rate", "url": "https://blogs.fangraphs.com/an-meandering-examination-of-fly-ball-pull-rate-featuring-stars-of-the-game-and-also-isaac-paredes/"}], "status": "not_started"}, {"id": "swing_path_metrics", "title": "Swing Path - Attack Angle, Attack Direction, Swing Path Tilt", "domain": "hitting", "level": 3, "summary": "Vertical (attack angle; 5-20 deg \"ideal\") and horizontal (attack direction, pull/oppo) bat direction at contact plus the swing-plane steepness over the final 40 ms (tilt), and how timing and pitch height distort each.", "prerequisites": ["bat_tracking", "exit_velocity_launch_angle", "spray_angle_direction"], "sources": [{"title": "MLB.com: 4 new swing metrics tell us more than we've ever known about contact (Petriello, 2025)", "url": "https://www.mlb.com/news/new-statcast-swing-metrics-2025"}, {"title": "FanGraphs: Test Driving Statcast's Newest Bat Tracking Metrics (Andrews, 2025)", "url": "https://blogs.fangraphs.com/test-driving-statcasts-newest-bat-tracking-metrics"}, {"title": "Examining Swing Path Tilt (Salorio, 2025)", "url": "https://adamsalorio.substack.com/p/examining-swing-path-tilt"}], "status": "not_started"}, {"id": "hitter_aging", "title": "Hitter Aging by Component", "domain": "hitting", "level": 4, "summary": "Component-level hitter aging: power, exit velocity and barrels peak around 27 to 30, ISO falls a year or two before xISO as speed declines, delta-method curves carry survivor bias, and bat speed may be an early decline signal.", "prerequisites": ["aging_curves", "batted_ball_quality", "plate_discipline", "bat_tracking", "aging_survivor_bias"], "sources": [{"title": "FanGraphs: Savant Hitter Aging Curves & Improvement Chances (Zimmerman, 2023)", "url": "https://fantasy.fangraphs.com/savant-hitter-aging-curves-improvement-chances/"}, {"title": "FanGraphs: Component Changes in New Hitter Aging Curves (Zimmerman, 2014)", "url": "https://blogs.fangraphs.com/component-changes-in-new-hitter-aging-curves"}], "status": "not_started"}, {"id": "hitter_process_composites", "title": "Hitter Process Composites (\"Swing+\" style)", "domain": "hitting", "level": 4, "summary": "Combining swing-decision quality, bat speed and collision efficiency into a single process-based hitter grade analogous to Stuff+, since each explains distinct variance in wOBA.", "prerequisites": ["swing_decisions", "squared_up_blasts_swords", "gbm_models"], "sources": [{"title": "Exploratory Data Analysis into Swing+ and Bat Tracking Data (Salorio, 2024)", "url": "https://adamsalorio.substack.com/p/exploratory-data-analysis-into-swing"}, {"title": "A Closer Look at Swing Decision Metrics (Salorio) - bat-speed swing model", "url": "https://adamsalorio.substack.com/p/a-closer-look-at-swing-decision-metrics"}], "status": "not_started"}, {"id": "hitter_projection", "title": "Hitter Projection Fundamentals", "domain": "hitting", "level": 4, "summary": "Weighted multi-year component rates, regression toward the mean by stabilization, age adjustment, park/league context and platoon handling (Marcel as the floor; ZiPS-style comparables and z-stats).", "prerequisites": ["projection_systems", "hitter_aging", "platoon_splits", "expected_stats", "reliability_stabilization"], "sources": [{"title": "Baseball-Reference: Marcel the Monkey Forecasting System", "url": "https://www.baseball-reference.com:443/about/marcels.shtml"}, {"title": "FanGraphs: The 2026 ZiPS Projections Are Almost Here (Szymborski)", "url": "https://blogs.fangraphs.com/the-2026-zips-projections-are-almost-here"}], "status": "not_started"}, {"id": "swing_change_detection", "title": "Hitting Development and Swing-Change Detection", "domain": "hitting", "level": 4, "summary": "Telling real swing changes (bat speed gains, flatter/steeper path, more pull-air) from noise using fast-stabilizing bat-tracking metrics and changepoint methods, and connecting them to development programs (e.g. Driveline bat-speed training).", "prerequisites": ["swing_path_metrics", "reliability_stabilization", "bayesian_shrinkage", "pull_air_approach"], "sources": [{"title": "Tractable Algorithms for Changepoint Detection in Player Performance Metrics (arXiv 2510.25961)", "url": "https://arxiv.org/html/2510.25961v1"}, {"title": "Cronkite News: Bat speed training in MLB (2026)", "url": "https://cronkitenews.azpbs.org/2026/04/09/bat-speed-training-mlb/"}, {"title": "FanGraphs: Early 2025 Hitter Average Bat Speed Risers and Fallers", "url": "https://fantasy.fangraphs.com/early-2025-hitter-average-bat-speed-risers-and-fallers/"}], "status": "not_started"}, {"id": "swing_decisions", "title": "Swing Decision Models (SwRV, SEAGER)", "domain": "hitting", "level": 4, "summary": "Pitch-level models that estimate the expected run value of swinging vs taking given location, count and pitch traits, then grade each decision (SwRV) or measure selective aggression as correct takes minus hittable pitches taken (SEAGER).", "prerequisites": ["swing_take_run_value", "gbm_models", "reliability_stabilization"], "sources": [{"title": "A Closer Look at Swing Decision Metrics (Salorio)", "url": "https://adamsalorio.substack.com/p/a-closer-look-at-swing-decision-metrics"}, {"title": "Baseball Prospectus: SEAGER at the Team Level (Orr, 2023)", "url": "https://baseballprospectus.com/?p=86926"}, {"title": "Baseball Prospectus: The Crooked Inning - SEAGER Reliability and Risers (Orr, 2024)", "url": "https://www.baseballprospectus.com/news/article/93876/the-crooked-inning-seager-reliability-and-risers/"}], "status": "not_started"}, {"id": "swing_timing_miss_distance", "title": "Swing Timing and Miss Distance (Statcast 2026)", "domain": "hitting", "level": 4, "summary": "June 2026 Savant metrics grading every swing as early/late/on-time, over/under/lined-up, and tied-up/flail/centered, yielding Perfect Contact % and Flawed Swing %, plus barrel-to-ball miss distance on whiffs. Swords, swings where the pitcher forces a non-competitive, fooled check-through, belong to the same pitcher-side view of bad swings.", "prerequisites": ["swing_path_metrics", "intercept_point_stance", "squared_up_blasts_swords", "bat_tracking"], "sources": [{"title": "Baseball Savant Changelog: Swing Timing & Miss Distance (2026-06-09)", "url": "https://baseballsavant.mlb.com/changelog/2026-06-09-swing-timing-miss-distance"}, {"title": "MLB.com: Which pitches miss bats by the most? Now you can know (Petriello, 2026)", "url": "https://www.mlb.com/news/explaining-the-new-miss-distance-statcast-metric"}, {"title": "MLB.com: MLB hitters with best swing timing in 2026 (Adler, 2026)", "url": "https://www.mlb.com/news/mlb-hitters-with-best-swing-timing-in-2026"}, {"title": "MLB.com - Nastiest pitch types on the new miss distance leaderboard (2026)", "url": "https://www.mlb.com/news/nastiest-pitch-types-on-statcast-miss-distance-leaderboard"}], "status": "not_started"}, {"id": "hitter_relative_contact_profiles", "title": "Hitter-Relative Contact and Swing Profiles", "domain": "hitting", "level": 5, "summary": "Evaluating timing and path relative to each hitter's own norms (e.g. deep/middle/forward contact vs his average, personal effective attack-angle window) rather than league-wide \"ideal\" bands.", "prerequisites": ["swing_timing_miss_distance", "mixed_models"], "sources": [{"title": "FanGraphs: I Had an Idea About Bat Tracking Data (Clemens, 2025)", "url": "https://blogs.fangraphs.com/i-had-an-idea-about-bat-tracking-data"}, {"title": "Twins Daily: Royce Lewis's Attack Angle and the Illusion of the Ideal", "url": "https://twinsdaily.com/news-rumors/minnesota-twins/royce-lewiss-attack-angle-and-the-illusion-of-the-ideal-r19609/"}], "status": "not_started"}, {"id": "swing_intent_causal_models", "title": "Swing Intent and Causal Bat-Tracking Models", "domain": "hitting", "level": 5, "summary": "Separating intended from realized bat speed/length (hierarchical skew-normal models on squared-up fastball swings), then using count-driven intent as an instrument to estimate causal effects on contact and power, valued via a PA Markov chain.", "prerequisites": ["contact_power_tradeoff", "bayesian_shrinkage", "mixed_models", "run_expectancy", "simulation_markov"], "sources": [{"title": "Powers & Yurko: Swinging, Fast and Slow - Interpreting variation in baseball swing tracking metrics (arXiv 2507.01238)", "url": "https://www.arxiv.org/pdf/2507.01238"}], "status": "not_started"}, {"id": "tracking_informed_projection", "title": "Tracking-Informed Hitter Projection (Frontier)", "domain": "hitting", "level": 5, "summary": "Using fast-stabilizing process inputs (bat speed, swing path, decisions, timing) as informative priors or features for outcome projections, so skill changes are detected seasons before slow outcome stats move.", "prerequisites": ["hitter_projection", "hitter_process_composites", "swing_change_detection", "swing_intent_causal_models"], "sources": [{"title": "Evaluating Bat Speed's Predictive Ability (Salorio)", "url": "https://adamsalorio.substack.com/p/evaluating-bat-speeds-predictive"}, {"title": "FanGraphs: The 2026 ZiPS Projections Are Almost Here (Statcast inputs added only when proven)", "url": "https://blogs.fangraphs.com/the-2026-zips-projections-are-almost-here"}], "status": "not_started"}, {"id": "pitch_physics", "title": "Forces on a pitched ball", "domain": "pitching", "level": 1, "summary": "A pitch's flight comes from three forces (gravity, drag slowing it along its path, and the Magnus force from spin), and you get \"movement\" by taking gravity out and isolating the spin-driven acceleration.", "prerequisites": [], "sources": [{"title": "Alan Nathan - Pitch Movement, Spin Efficiency, and All That (The Hardball Times)", "url": "https://tht.fangraphs.com/pitch-movement-spin-efficiency-and-all-that/"}, {"title": "Alan Nathan - The Effect of Spin on the Flight of a Baseball (arXiv)", "url": "https://arxiv.org/pdf/physics/0605041"}], "status": "not_started"}, {"id": "pitch_tracking_measurement", "title": "How pitches are tracked (Hawk-Eye, Trackman, trajectory fits)", "domain": "pitching", "level": 1, "summary": "Statcast's Hawk-Eye cameras (and Trackman radar before them) record each pitch's release, velocity, constant-acceleration trajectory fit and spin, and every derived pitch metric picks up the noise and conventions of that measurement.", "prerequisites": ["pitch_physics", "statcast_data"], "sources": [{"title": "Alan Nathan - Hawk-Eye spin analysis, Part I", "url": "https://baseball.physics.illinois.edu/HawkeyeSpinAnalysis-Part%20I-rev1.pdf"}, {"title": "Alan Nathan - Pitch Movement, Spin Efficiency, and All That", "url": "https://tht.fangraphs.com/pitch-movement-spin-efficiency-and-all-that/"}], "status": "not_started"}, {"id": "release_extension_perceived_velocity", "title": "Velocity, release point, extension and perceived velocity", "domain": "pitching", "level": 1, "summary": "Release speed, the 3D release point, and extension (how far in front of the rubber the ball comes out) combine into perceived velocity, which is how fast a pitch effectively plays given the batter's shorter reaction time.", "prerequisites": ["pitch_tracking_measurement"], "sources": [{"title": "MLB Glossary - Extension", "url": "https://www.mlb.com/glossary/statcast/extension"}, {"title": "MLB Glossary - Perceived Velocity", "url": "https://www.mlb.com/glossary/statcast/perceived-velocity"}], "status": "not_started"}, {"id": "approach_angles", "title": "Vertical and horizontal approach angle (VAA/HAA)", "domain": "pitching", "level": 2, "summary": "The angle at which a pitch enters the zone folds release height, extension, velocity, carry and plate location into one number, and it should be height-adjusted because flatter four-seamers up in the zone get more whiffs.", "prerequisites": ["pitch_movement_ivb", "release_extension_perceived_velocity"], "sources": [{"title": "Alex Chamberlain - A Visualized Primer on Vertical Approach Angle (FanGraphs, 2022)", "url": "https://blogs.fangraphs.com/a-visualized-primer-on-vertical-approach-angle-vaa"}, {"title": "Michael Rosen - It's Release Angles All The Way Down (FanGraphs, 2024)", "url": "https://blogs.fangraphs.com/its-release-angles-all-the-way-down"}], "status": "not_started"}, {"id": "arm_angle", "title": "Statcast arm angle and slot-relative movement", "domain": "pitching", "level": 2, "summary": "Statcast arm angle (0 = sidearm, 90 = over the top, measured from shoulder to ball at release, data back to 2020) sets which spin directions and shapes come naturally, so movement is best judged against what a given slot would be expected to produce.", "prerequisites": ["release_extension_perceived_velocity", "pitch_movement_ivb"], "sources": [{"title": "Baseball Savant - Pitcher Arm Angles leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/pitcher-arm-angles"}, {"title": "MLB.com - How arm slot and arm angle affect pitches (2024)", "url": "https://www.mlb.com/news/how-arm-slot-and-arm-angle-affect-pitches"}, {"title": "FanGraphs - More Stats: ABS Strike Zone, Arm Angles, Spin Rate (2026)", "url": "https://blogs.fangraphs.com/more-stats-abs-strike-zone-arm-angles-spin-rate"}], "status": "not_started"}, {"id": "ball_weather_physics", "title": "Ball, air and weather effects", "domain": "pitching", "level": 2, "summary": "Estimate drag from pitch trajectories and understand how air density (altitude, temperature, humidity) and ball-to-ball variation move carry, home-run rate and movement, and why these effects must be removed before comparing pitchers or parks across seasons.", "prerequisites": ["pitch_physics", "statcast_data"], "sources": [{"title": "Albert & Nathan, Home Runs and Drag: An Early Look at the 2022 Season", "url": "https://blogs.fangraphs.com/home-runs-and-drag-an-early-look-at-the-2022-season"}, {"title": "MLB report on baseballs and home-run rates (2018)", "url": "https://www.mlb.com/news/mlb-report-on-baseballs-home-run-rates-c278120310"}], "status": "not_started"}, {"id": "pitch_classification", "title": "Pitch classification and pitch subtypes", "domain": "pitching", "level": 2, "summary": "Pitch-type labels come from classifiers or clustering on velocity, movement and spin, the categories keep shifting (Statcast added the sweeper and slurve in 2023), and finer subtypes within a type can perform very differently.", "prerequisites": ["pitch_movement_ivb"], "sources": [{"title": "MLB Glossary - Sweeper", "url": "https://www.mlb.com/glossary/pitch-types/sweeper"}, {"title": "Camp, Sarris & Dvorocsik - Using Clustering to Find Pitch Subtypes and Effective Pairings (SABR BRJ, 2020)", "url": "https://sabr.org/journal/article/using-clustering-to-find-pitch-subtypes-and-effective-pairings/"}, {"title": "Trouble With The Curve: Improving MLB Pitch Classification (arXiv)", "url": "https://arxiv.org/pdf/1304.1756"}, {"title": "MLB Glossary - Slurve", "url": "https://www.mlb.com/glossary/pitch-types/slurve"}], "status": "not_started"}, {"id": "pitch_movement_ivb", "title": "Pitch movement and induced vertical break (IVB)", "domain": "pitching", "level": 2, "summary": "Horizontal break and IVB measure how far a pitch deviates from a spinless pitch at the same velocity, and they are the standard currency for describing pitch shape.", "prerequisites": ["spin_rate_and_efficiency"], "sources": [{"title": "MLB Glossary - Induced Vertical Break", "url": "https://www.mlb.com/glossary/statcast/induced-vertical-break"}, {"title": "Baseball Savant - Pitch Movement leaderboard", "url": "https://baseballsavant.mlb.com/pitch-movement"}], "status": "not_started"}, {"id": "spin_rate_and_efficiency", "title": "Spin rate, active spin and gyro spin", "domain": "pitching", "level": 2, "summary": "Total spin breaks into transverse spin, which produces Magnus movement, and gyro spin, which produces none, and spin efficiency (Savant's \"active spin\") is the transverse share.", "prerequisites": ["pitch_physics", "pitch_tracking_measurement"], "sources": [{"title": "Alan Nathan - Pitch Movement, Spin Efficiency, and All That", "url": "https://tht.fangraphs.com/pitch-movement-spin-efficiency-and-all-that/"}, {"title": "Baseball Savant - Active Spin leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/active-spin"}], "status": "not_started"}, {"id": "fastball_relative_features", "title": "Fastball-relative (primary-pitch) features", "domain": "pitching", "level": 3, "summary": "A secondary pitch is judged by how far its velocity and movement sit from the pitcher's primary pitch in that outing, and how you define \"primary\" (90th-percentile fastball versus most-used pitch) changes the grades.", "prerequisites": ["pitch_movement_ivb", "pitch_classification"], "sources": [{"title": "Thomas Nestico - Modelling tjStuff+ v2.0 (2024)", "url": "https://tjstats.ca/2024/05/04/modelling-tjstuff-plus-v20/"}, {"title": "Adam Salorio - aStuff+ v2 Preview (2025)", "url": "https://adamsalorio.substack.com/p/astuff-v2-preview"}], "status": "not_started"}, {"id": "location_command_models", "title": "Location and command models (Location+, edge rates)", "domain": "pitching", "level": 3, "summary": "Location models score a pitch's location given count and pitch type against league-wide intent (Location+, PitchingBot command, edge and heart rates), and they are hard to build because the pitcher's actual target is unknown.", "prerequisites": ["count_run_values", "plate_discipline", "called_strike_probability"], "sources": [{"title": "FanGraphs Library - Stuff+, Location+, and Pitching+ Primer", "url": "https://library.fangraphs.com/pitching/stuff-location-and-pitching-primer"}, {"title": "Eno Sarris - Why We Still Don't Have a Great Command Metric (FanGraphs, 2017)", "url": "https://blogs.fangraphs.com/why-we-still-dont-have-a-great-command-metric"}], "status": "not_started"}, {"id": "pitch_tunneling", "title": "Pitch tunneling", "domain": "pitching", "level": 3, "summary": "Tunneling compares consecutive pitches at a batter decision point about 24 feet from the plate (tunnel differential versus plate break, and the break-to-tunnel ratio), a geometric property of pitch pairs rather than a separate mechanical skill.", "prerequisites": ["pitch_movement_ivb", "release_extension_perceived_velocity"], "sources": [{"title": "Judge, Long & Pavlidis - Prospectus Feature: Two Ways to Tunnel (Baseball Prospectus, 2017)", "url": "https://www.baseballprospectus.com/?p=31040"}, {"title": "Dan Blewett - Pitch Tunneling: Is It Real? (The Hardball Times, 2017)", "url": "https://tht.fangraphs.com/pitch-tunneling-is-it-real-and-how-do-pitchers-actually-pitch"}], "status": "not_started"}, {"id": "pitcher_aging", "title": "Pitcher aging: velocity, stuff and role", "domain": "pitching", "level": 3, "summary": "Fastball velocity stays near peak into the late 20s and then declines at an accelerating rate, strikeout rate follows velocity, and starter-to-reliever role changes bias naive curves, so stuff-based projection needs its own aging curve rather than an ERA curve.", "prerequisites": ["aging_curves", "release_extension_perceived_velocity"], "sources": [{"title": "Bill Petti, Pitcher Aging Curves: Introduction", "url": "https://blogs.fangraphs.com/pitcher-aging-curves-introduction/"}, {"title": "Brooks Platt, 'Stuff' and Father Time", "url": "https://community.fangraphs.com/stuff-and-father-time/"}], "status": "not_started"}, {"id": "pitching_biomechanics", "title": "Pitching biomechanics fundamentals", "domain": "pitching", "level": 3, "summary": "The kinematic sequence, shoulder external rotation, trunk and arm velocities, and elbow varus torque link a delivery to velocity and arm stress, and Driveline's OpenBiomechanics gives a public marker-based dataset with point-of-interest metrics.", "prerequisites": ["release_extension_perceived_velocity", "arm_angle"], "sources": [{"title": "Driveline - OpenBiomechanics Project (GitHub)", "url": "https://www.github.com/drivelineresearch/openbiomechanics"}], "status": "not_started"}, {"id": "spin_axis_seam_shifted_wake", "title": "Spin axis, axis differential and seam-shifted wake", "domain": "pitching", "level": 3, "summary": "Since 2020 Hawk-Eye has measured the spin axis directly, and the gap between that observed axis and the axis inferred from movement is mostly seam-shifted wake, a non-Magnus force set by seam orientation that is especially important for sinkers, changeups and sweepers.", "prerequisites": ["pitch_movement_ivb", "spin_rate_and_efficiency"], "sources": [{"title": "Smith, Pavlidis & Nathan - Not Just About Magnus Anymore (Baseball Prospectus, 2020)", "url": "https://www.baseballprospectus.com/?p=63712"}, {"title": "The Seam-Shifted Revolution Is Headed for the Mainstream (FanGraphs)", "url": "https://blogs.fangraphs.com/the-seam-shifted-revolution-is-headed-for-the-mainstream"}], "status": "not_started"}, {"id": "workload_fatigue", "title": "Workload and in-game fatigue signals", "domain": "pitching", "level": 3, "summary": "Fatigue shows up as velocity, extension and release-height drift with pitch count. One small public case study (three starters) found lower baselines after the 2023 pitch clock but no significant steepening of within-outing decline; treat that as a hypothesis, not a finding.", "prerequisites": ["release_extension_perceived_velocity", "mixed_models"], "sources": [{"title": "Evaluating Pitcher Fatigue in the Pitch Clock Era (Statcast analysis)", "url": "https://zgolub.quarto.pub/evaluating-pitcher-fatigue-in-the-pitch-clock-era-a-statcast-based-analysis-of-velocity-release-extension-and-release-point-drift/"}], "status": "not_started"}, {"id": "arsenal_interaction", "title": "Arsenal interaction and pitch pairings", "domain": "pitching", "level": 4, "summary": "A pitch's value depends on the pitches around it (velocity and movement separation, subtype pairings), so arsenal-level metrics and \"what new pitch would this pitcher grade well with\" models extend pitch-level stuff.", "prerequisites": ["stuff_models", "pitch_classification", "pitch_tunneling"], "sources": [{"title": "Camp, Sarris & Dvorocsik - Using Clustering to Find Pitch Subtypes and Effective Pairings", "url": "https://sabr.org/journal/article/using-clustering-to-find-pitch-subtypes-and-effective-pairings/"}, {"title": "CMSAC SURE 2024 - Predicting the Optimal Pitch Arsenal Adjustment for Superior Stuff+", "url": "https://www.stat.cmu.edu/cmsac/sure/2024/showcase/baseball_dodgers/report.html"}, {"title": "Prospects Live - Introducing Arsenal: a metric considering how pitches play off one another", "url": "https://www.prospectslive.com/introducing-arsenal-a-metric-considering-how-pitches-play-off-one-another/"}], "status": "not_started"}, {"id": "deception_metrics", "title": "Deception - predictability, expected movement and surprise", "domain": "pitching", "level": 4, "summary": "Deception models ask how well a batter could identify a pitch at the decision point given release, early flight and count, and how surprising its movement is against expectations from slot or arsenal (BP Pitch Type Probability, Movement/Velocity Spread, Surprise Factor).", "prerequisites": ["pitch_tunneling", "arm_angle", "arsenal_interaction"], "sources": [{"title": "Stephen Sutton-Brown - Introducing BP's New Arsenal Metrics (Baseball Prospectus, 2025)", "url": "https://www.baseballprospectus.com/?p=96026"}, {"title": "Luke Smailes - Expected Run Value 2.0: Adding Deception (Pitcher List, 2021)", "url": "https://pitcherlist.com/expected-run-value-xrv-2-0-adding-deception/"}, {"title": "Eno Sarris - An Attempt to Quantify Pitcher Deception (FanGraphs, 2016)", "url": "https://blogs.fangraphs.com/an-attempt-to-quantify-pitcher-deception"}], "status": "not_started"}, {"id": "injury_risk_ucl", "title": "Pitcher injury risk (UCL, velocity, pitch clock)", "domain": "pitching", "level": 4, "summary": "MLB's 2024 injury report blames rising velocity, pitch shaping and max effort for IL growth, while AJSM work on the pitch clock finds UCL injury incidence per inning about flat, so injury modeling has to weigh workload, intensity and biomechanics together.", "prerequisites": ["workload_fatigue", "pitching_biomechanics"], "sources": [{"title": "NBC Sports/AP - MLB study: max velocity and effort likely causing pitching injuries (Dec 2024)", "url": "https://www.nbcsports.com/mlb/news/mlb-study-velocity-max-efforts-likely-causing-pitching-injuries-rule-changes-should-be-considered"}, {"title": "VeloUniversity - The Pitch Clock Paradox (summarizing Card et al., AJSM 2025)", "url": "https://www.velouniversity.com/post/the-pitch-clock-paradox-why-faster-games-may-be-protecting-pitchers-elbows"}], "status": "not_started"}, {"id": "interpretable_relative_physics_models", "title": "Interpretable additive stuff models with relative physics", "domain": "pitching", "level": 4, "summary": "GAM-style stuff models with splines and tensor interactions score a pitch on residuals from its expected approach angle and pitch-type break, which makes the grade easier to read and keeps pitcher identity out of the model.", "prerequisites": ["stuff_model_design_choices", "mixed_models", "approach_angles"], "sources": [{"title": "Cade Cavin - Shape+ v2.0: Isolating Pitch Quality With Relative Physics and Additive Modeling (FanGraphs Community, 2026)", "url": "https://community.fangraphs.com/shape-v2-0-isolating-pitch-quality-with-relative-physics-and-additive-modeling/"}], "status": "not_started"}, {"id": "markerless_motion_capture", "title": "Markerless in-game motion capture (KinaTrax, Sony/Hawk-Eye)", "domain": "pitching", "level": 4, "summary": "In-stadium markerless systems capture skeletal kinematics on every game pitch, with variability similar to lab marker-based data, but their mean values are system-specific and should not be pooled with marker-based numbers.", "prerequisites": ["pitching_biomechanics", "pitch_tracking_measurement"], "sources": [{"title": "Lerch, Fleisig, Slowik & Oliver - Variability of in-game markerless and laboratory marker-based pitching biomechanics (J. Biomechanics, 2025)", "url": "https://asmi.org/wp-content/uploads/LERCH-Journal-of-Biomechanics-2025-188-112775.pdf"}, {"title": "Giordano et al. - Normative In-Game Data for Collegiate Pitchers Using Markerless Tracking (OJSM, 2024)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11544755"}, {"title": "SVG: Sony acquires KinaTrax (October 2024)", "url": "https://www.sportsvideo.org/2024/10/18/sony-makes-big-sports-move-acquires-kinatrax-inc-to-expand-its-sports-data-business-into-player-performance"}], "status": "not_started"}, {"id": "overall_pitch_quality_models", "title": "Combined pitch models (Pitching+, PitchPro, botOvr)", "domain": "pitching", "level": 4, "summary": "Combined models fit stuff, location, count and batter handedness together as a separate model rather than a weighted average of stuff and location, and they estimate run value given everything about the pitch.", "prerequisites": ["stuff_models", "location_command_models"], "sources": [{"title": "FanGraphs Library - Stuff+, Location+, and Pitching+ Primer", "url": "https://library.fangraphs.com/pitching/stuff-location-and-pitching-primer"}, {"title": "Stephen Sutton-Brown - Introducing StuffPro and PitchPro", "url": "https://www.baseballprospectus.com/?p=89245"}], "status": "not_started"}, {"id": "pitch_design_development", "title": "Pitch design with Rapsodo, Trackman and Edgertronic", "domain": "pitching", "level": 4, "summary": "Player development pairs portable ball tracking and high-speed video of grip and seam orientation with stuff models as a feedback loop for building new shapes (sweepers, seam-shifted sinkers, adding carry).", "prerequisites": ["stuff_models", "spin_axis_seam_shifted_wake", "arm_angle"], "sources": [{"title": "MLB.com - Rapsodo and Edgertronic are changing baseball", "url": "https://www.mlb.com/news/rapsodo-and-edgertronic-are-changing-baseball"}, {"title": "Sports Illustrated - From Trackman to Edgertronic to Rapsodo, the tech boom (2019)", "url": "https://www.si.com/mlb/2019/03/28/technology-revolution-baseball-trackman-edgertronic-rapsodo"}], "status": "not_started"}, {"id": "pitch_mix_optimization", "title": "Pitch mix, sequencing and game theory", "domain": "pitching", "level": 4, "summary": "In a pitcher-batter game, the best mix roughly equalizes the marginal run values of the pitches, with diminishing returns as usage rises, so a gap between a pitch's value and its usage points to a mix that should change. Sequencing extends this to count-conditional pitch selection and to how one pitch changes the value of the next.", "prerequisites": ["count_run_values", "arsenal_interaction"], "sources": [{"title": "ESPN - Which 2025 MLB pitchers are throwing the right (and wrong) pitches: game theory", "url": "https://global.espn.com/mlb/story/_/id/45539286/which-2025-mlb-pitchers-throwing-right-wrong-pitches-game-theory"}, {"title": "FiveThirtyEight - Game Theory Says R.A. Dickey Should Throw More Knuckleballs", "url": "https://fivethirtyeight.com/features/game-theory-says-r-a-dickey-should-throw-more-knuckleballs"}], "status": "not_started"}, {"id": "pitch_model_reliability", "title": "Reliability and stabilization of pitch metrics", "domain": "pitching", "level": 4, "summary": "Stuff becomes reliable in about 80 pitches and is the stickiest part year to year, while location needs about 400 pitches and is less stable, which is why pitch models beat outcome stats early in a season.", "prerequisites": ["overall_pitch_quality_models", "regression_to_mean"], "sources": [{"title": "FanGraphs Library - Stuff+, Location+, and Pitching+ Primer", "url": "https://library.fangraphs.com/pitching/stuff-location-and-pitching-primer"}], "status": "not_started"}, {"id": "pitch_outcome_decomposition", "title": "Decomposing a pitch into outcome sub-models", "domain": "pitching", "level": 4, "summary": "Classification-style pitch models predict P(swing), P(called strike/ball), P(whiff/foul/in play) and a batted-ball value, then weight each outcome by its count-specific run value and sum them into expected run value.", "prerequisites": ["count_run_values", "swing_decisions", "batted_ball_quality", "gbm_models"], "sources": [{"title": "Stephen Sutton-Brown - Introducing StuffPro and PitchPro (Baseball Prospectus, 2024)", "url": "https://www.baseballprospectus.com/?p=89245"}, {"title": "Cameron Grove - A PitchingBot Overhaul (2021)", "url": "https://baseballaheadinthecount.blogspot.com/2021/10/a-pitchingbot-overhaul.html"}], "status": "not_started"}, {"id": "stuff_in_projection", "title": "Using pitch quality in pitcher projection", "domain": "pitching", "level": 4, "summary": "Projection systems now feed platoon-adjusted pitch-quality ratings into event models: PECOTA 2025 puts StuffPro into a Stan multinomial over batting events, with the largest gains for rookies (about 113 of 341 pitcher runs in backtests) but real gains for established pitchers too, and leaves out location-inclusive PitchPro because location context persists less.", "prerequisites": ["projection_systems", "pitch_model_reliability", "fip_family", "bayesian_shrinkage", "pitcher_aging"], "sources": [{"title": "Jonathan Judge - PECOTA 2025: An Introduction (Baseball Prospectus)", "url": "https://www.baseballprospectus.com/?p=96300"}, {"title": "Prospects Live - Evaluating 2023 Pitching Projections", "url": "https://www.prospectslive.com/evaluating-2023-pitching-projections/"}], "status": "not_started"}, {"id": "stuff_model_design_choices", "title": "Stuff model design choices - regression versus classification and target choice", "domain": "pitching", "level": 4, "summary": "The main design forks are regressing xRV directly (tjStuff+, aStuff+) versus classifying outcomes and summing (StuffPro, PitchingBot), how to remove location from a stuff-only model, whether to adjust for environment, platoon or altitude, and avoiding pitcher-identity leakage.", "prerequisites": ["stuff_models", "pitch_outcome_decomposition", "ball_weather_physics"], "sources": [{"title": "Adam Salorio - aStuff+ v2 Preview", "url": "https://adamsalorio.substack.com/p/astuff-v2-preview"}, {"title": "Stephen Sutton-Brown - Introducing StuffPro and PitchPro", "url": "https://www.baseballprospectus.com/?p=89245"}], "status": "not_started"}, {"id": "stuff_models", "title": "Stuff models (Stuff+, StuffPro, PitchingBot, tjStuff+, aStuff+)", "domain": "pitching", "level": 4, "summary": "A stuff model predicts a pitch's expected run value from physical traits alone (velocity, movement, spin, release, extension, axis differential, fastball deltas), usually with tree-boosting models, and puts the result on a 100-centered scale.", "prerequisites": ["count_run_values", "fastball_relative_features", "spin_axis_seam_shifted_wake", "approach_angles", "gbm_models"], "sources": [{"title": "FanGraphs Library - Stuff+, Location+, and Pitching+ Primer", "url": "https://library.fangraphs.com/pitching/stuff-location-and-pitching-primer"}, {"title": "FanGraphs - PitchingBot and Stuff+ Pitch Modeling Are Now on FanGraphs (2023)", "url": "https://blogs.fangraphs.com/pitchingbot-and-stuff-pitch-modeling-are-now-on-fangraphs"}, {"title": "Thomas Nestico - Modelling tjStuff+ v2.0", "url": "https://tjstats.ca/2024/05/04/modelling-tjstuff-plus-v20/"}], "status": "not_started"}, {"id": "biomechanics_to_pitch_shape", "title": "Linking delivery mechanics to pitch shape and stuff", "domain": "pitching", "level": 5, "summary": "The frontier is joining skeletal tracking to ball flight, using release angles, arm path and body kinematics to explain and predict carry, VAA and stuff for pitch design and health together, and most of that data is still inside teams.", "prerequisites": ["markerless_motion_capture", "stuff_models", "approach_angles", "pitch_design_development"], "sources": [{"title": "Michael Rosen - It's Release Angles All The Way Down (FanGraphs, 2024)", "url": "https://blogs.fangraphs.com/its-release-angles-all-the-way-down"}, {"title": "Hawk-Eye Innovations - KinaTrax", "url": "https://www.hawkeyeinnovations.com/kinatraxlab"}], "status": "not_started"}, {"id": "intent_based_command", "title": "Intent-aware command (latent targets, release-angle consistency)", "domain": "pitching", "level": 5, "summary": "Newer command metrics treat the intended target as a latent variable, using per-pitcher Gaussian-mixture priors with Bayesian posterior updates (xCTRL) or the consistency of release angles (Kirby Index), to separate intent from execution.", "prerequisites": ["location_command_models", "bayesian_shrinkage", "approach_angles"], "sources": [{"title": "Ludwig, Brill & Wyner - Separating Intent from Execution: A Probabilistic Approach to Pitch Location Accuracy (arXiv, 2025)", "url": "https://arxiv.org/pdf/2508.19184v1.pdf"}, {"title": "Michael Rosen - Introducing the Kirby Index (2024)", "url": "https://pitchplots.substack.com/p/introducing-the-kirby-index-a-new"}], "status": "not_started"}, {"id": "stuff_model_goodhart", "title": "Stuff model decay - Goodhart's law and the competitive-advantage cycle", "domain": "pitching", "level": 5, "summary": "Now that teams design pitches to the model, Stuff+ spread has shrunk (SD about 9.6 to 8.8 by 2025) and its correlation with wOBA has fallen, so public stuff grades are a moving target that needs retraining and outcome checks.", "prerequisites": ["pitch_design_development", "pitch_model_reliability"], "sources": [{"title": "They Don't Make Pitch Models Like They Used To (Jan 2026)", "url": "https://pitchinggripsbaseball.blogspot.com/2026/01/they-dont-make-pitch-models-like-they.html"}], "status": "not_started"}, {"id": "fielding_alignments_and_shift_rules", "title": "Fielding Alignments and the 2023 Shift Restriction", "domain": "defense", "level": 1, "summary": "How Statcast classifies infield and outfield alignments (standard, shaded, strategic, 4th outfielder) and how the 2023 rule (two infielders on each side of second base, all four on the dirt) limited where defenders can stand.", "prerequisites": ["statcast_data"], "sources": [{"title": "MLB Glossary - Fielding Alignments", "url": "https://www.mlb.com/glossary/statcast/shifts"}, {"title": "Causal effect of the infield shift in the MLB (Markes et al., arXiv)", "url": "https://arxiv.org/pdf/2409.03940"}], "status": "not_started"}, {"id": "sprint_speed", "title": "Sprint Speed", "domain": "defense", "level": 1, "summary": "Statcast's runner-speed measure (ft/s over the fastest one-second window, averaged over a player's best competitive runs), used as an input to infield OAA, arm value and stolen-base models.", "prerequisites": ["statcast_data"], "sources": [{"title": "MLB Glossary - Sprint Speed", "url": "https://www.mlb.com/glossary/statcast/sprint-speed"}], "status": "not_started"}, {"id": "called_strike_probability", "title": "Called-strike probability and umpire zone models", "domain": "defense", "level": 2, "summary": "Fit the probability of a called strike given location, count, handedness and umpire with GAMs or hierarchical logistic models. This surface sits under framing, ABS challenge value, command models and swing decisions, and the 2026 ABS zone (17 in wide, 27% to 53.5% of batter height) gives it a fixed rulebook target to compare against.", "prerequisites": ["statcast_data", "regression_to_mean"], "sources": [{"title": "Deshpande & Wyner, A Hierarchical Bayesian Model of Pitch Framing", "url": "https://arxiv.org/pdf/1704.00823"}, {"title": "MLB: ABS Challenge System coming to the majors in 2026", "url": "https://www.mlb.com/press-release/press-release-mlb-announces-abs-challenge-system-coming-to-the-major-leagues-beginning-in-the-2026-season"}, {"title": "Jim Albert, Called Strikes (GAM models of umpire calls)", "url": "https://bayesball.github.io/BLOG/Called_Strikes.html"}], "status": "not_started"}, {"id": "catch_probability", "title": "Outfield Catch Probability", "domain": "defense", "level": 2, "summary": "Probability an average outfielder catches a ball, modeled from distance to travel, time available and direction (with wall adjustments); the per-play expectation behind outfield OAA.", "prerequisites": ["statcast_data", "batted_ball_quality"], "sources": [{"title": "MLB Glossary - Outs Above Average", "url": "https://www.mlb.com/glossary/statcast/outs-above-average"}, {"title": "Baseball Savant - Catch Probability leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/catch_probability"}, {"title": "Learning From Statcast's Outfield Jump Metrics (FanGraphs, 2022)", "url": "https://blogs.fangraphs.com/learning-from-statcasts-outfield-jump-metrics"}], "status": "not_started"}, {"id": "baserunning_run_value", "title": "Baserunning Run Value", "domain": "defense", "level": 3, "summary": "Statcast's runner value combining basestealing (net bases gained vs. success probability; an out costs more than a base gains) with extra bases taken on balls in play vs. expectation.", "prerequisites": ["stolen_base_model", "run_expectancy"], "sources": [{"title": "Who is baseball's best baserunner? Statcast's newest metric (MLB.com, 2024)", "url": "https://www.mlb.com/news/breaking-down-statcast-s-new-baserunning-stats"}, {"title": "Baseball Savant - Baserunning Run Value", "url": "https://baseballsavant.mlb.com/leaderboard/baserunning-run-value"}], "status": "not_started"}, {"id": "catcher_framing", "title": "Catcher Framing", "domain": "defense", "level": 3, "summary": "Credits catchers for called strikes above a location-based called-strike probability (Savant's model was extended to all zones in 2025, not only the shadow zone), at about 0.125 runs per strike; mixed models are the standard way to separate catcher, umpire, pitcher and batter effects.", "prerequisites": ["run_expectancy", "mixed_models", "called_strike_probability"], "sources": [{"title": "MLB Glossary - Catcher Framing", "url": "https://www.mlb.com/glossary/statcast/catcher-framing"}, {"title": "Baseball Savant changelog - Catcher framing and FRV update (2025-08-15)", "url": "https://baseballsavant.mlb.com/changelog/2025-08-15-catcher-framing-frv"}, {"title": "Framing and blocking pitches - a regressed, probabilistic model (SABR)", "url": "https://sabr.org/latest/framing-and-blocking-pitches-a-regressed-probablistic-model"}], "status": "not_started"}, {"id": "catcher_throwing", "title": "Catcher Throwing (Pop Time and CS Above Average)", "domain": "defense", "level": 3, "summary": "Separates the catcher's arm (pop time, exchange, arm strength) from runner and pitcher context, using caught-stealing-above-average against a stolen-base model's expectation, at about 0.65 runs per steal prevented.", "prerequisites": ["stolen_base_model"], "sources": [{"title": "Statcast's New Catcher Throwing Metric Is Here (FanGraphs, 2023)", "url": "https://blogs.fangraphs.com/statcasts-new-catcher-throwing-metric-is-here"}, {"title": "MLB Glossary - Fielding Run Value", "url": "https://www.mlb.com/glossary/statcast/fielding-run-value"}], "status": "not_started"}, {"id": "fielder_arm_value", "title": "Fielder Arm Strength and Throwing Value", "domain": "defense", "level": 3, "summary": "Arm strength is the top throw velocity on max-effort throws; arm value credits outfielders for runner kills and holds vs. the advance rate expected given runner speed and position, and debits them for extra bases allowed, in runs.", "prerequisites": ["statcast_data", "sprint_speed", "run_expectancy"], "sources": [{"title": "MLB Glossary - Arm Strength", "url": "https://www.mlb.com/glossary/statcast/arm-strength"}, {"title": "These are the best outfield throwing arms in baseball (MLB.com, 2023)", "url": "https://www.mlb.com/news/most-valuable-outfielder-throwing-arms-of-2023"}], "status": "not_started"}, {"id": "infield_out_probability", "title": "Infield Out Probability", "domain": "defense", "level": 3, "summary": "Expected-out model for infield batted balls using distance to the intercept point, time to get there, distance from intercept to the target base, and (on force plays) the batter's season sprint speed, scored from each fielder's actual starting position.", "prerequisites": ["statcast_data", "sprint_speed", "batted_ball_quality"], "sources": [{"title": "MLB Glossary - Outs Above Average", "url": "https://www.mlb.com/glossary/statcast/outs-above-average"}, {"title": "A new way to measure MLB's best infield defenders (MLB.com)", "url": "https://www.mlb.com/news/statcast-introduces-outs-above-average-for-infield-defense"}], "status": "not_started"}, {"id": "outs_above_average", "title": "Outs Above Average (OAA)", "domain": "defense", "level": 3, "summary": "Sums (actual out minus expected out probability) over a fielder's chances to give range in outs, split by fielder role and direction; needs shrinkage because single-season samples are noisy.", "prerequisites": ["catch_probability", "infield_out_probability", "regression_to_mean"], "sources": [{"title": "MLB Glossary - Outs Above Average", "url": "https://www.mlb.com/glossary/statcast/outs-above-average"}, {"title": "Baseball Savant - Outs Above Average", "url": "https://baseballsavant.mlb.com/outs_above_average"}, {"title": "Statcast OAA Is Now Available on FanGraphs", "url": "https://blogs.fangraphs.com/statcast-oaa-is-now-available-on-fangraphs"}], "status": "not_started"}, {"id": "stolen_base_model", "title": "Stolen Base Success Model and Post-2023 Run Game", "domain": "defense", "level": 3, "summary": "Per-opportunity steal success probability from runner speed, lead and jump, pitcher time and the disengagement count, plus break-even rates from run expectancy; 2023's larger bases and pickoff/disengagement limits pushed attempts and success rates up.", "prerequisites": ["sprint_speed", "run_expectancy", "in_game_tactics"], "sources": [{"title": "3 things you didn't know about all the SB in 2023 (MLB.com)", "url": "https://www.mlb.com/news/mlb-stolen-base-increase-in-2023-breakdown"}, {"title": "Baseball Savant - Pitcher Running Game leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/pitcher-running-game"}, {"title": "Baseball Savant - Basestealing Run Value", "url": "https://baseballsavant.mlb.com/leaderboard/basestealing-run-value"}], "status": "not_started"}, {"id": "abs_challenge_value", "title": "ABS Challenge Value and the Framing Decomposition", "domain": "defense", "level": 4, "summary": "Values each challenge with RE288 run values (break-even confidence of 0.2/(0.2+RV)), defines \"reasonable\" opportunities, and credits catchers separately for framing (the umpire's original call vs. strike probability) and challenge skill (original call to final call); catcher challenge value has been part of FRV since Oct 2026.", "prerequisites": ["catcher_framing", "run_expectancy", "count_run_values", "statcast_data", "called_strike_probability"], "sources": [{"title": "Baseball Savant - ABS Metrics Documentation", "url": "https://baseballsavant.mlb.com/abs-metrics-documentation"}, {"title": "Baseball Savant changelog - ABS leaderboard update, ABS in FRV (2026-10-08)", "url": "https://baseballsavant.mlb.com/changelog/2026-10-08-abs-leaderboard-update-frv"}, {"title": "Bad Pitch Framers Lead in ABS Challenge Success (SIS, 2026)", "url": "https://www.sportsinfosolutions.com/?p=9936"}, {"title": "MLB press release - ABS Challenge System coming in 2026", "url": "https://www.mlb.com/press-release/press-release-mlb-announces-abs-challenge-system-coming-to-the-major-leagues-beginning-in-the-2026-season"}], "status": "not_started"}, {"id": "catcher_blocking", "title": "Catcher Blocking", "domain": "defense", "level": 4, "summary": "Blocks above average vs. expected wild pitch/passed ball probability from pitch location, movement and runner state (about 0.25 runs per block); reproducible with GBMs, but standards for blocking value are still less settled than for framing.", "prerequisites": ["run_expectancy", "gbm_models"], "sources": [{"title": "Baseball Savant - Catcher Blocking leaderboard", "url": "https://baseballsavant.mlb.com/leaderboard/catcher-blocking"}, {"title": "Catcher Blocking Is Still The Wild West (FanGraphs, 2026)", "url": "https://blogs.fangraphs.com/catcher-blocking-is-still-the-wild-west"}], "status": "not_started"}, {"id": "fielder_positioning_optimization", "title": "Fielder Positioning Optimization", "domain": "defense", "level": 4, "summary": "Choosing starting positions from batter spray and batted-ball distributions to maximize expected outs, now constrained by the shift rule, which moved value back toward individual range and depth/shading choices.", "prerequisites": ["fielding_alignments_and_shift_rules", "outs_above_average", "batted_ball_quality", "selection_bias_causal"], "sources": [{"title": "Causal effect of the infield shift in the MLB (arXiv)", "url": "https://arxiv.org/pdf/2409.03940"}, {"title": "How Have the New Rules Changed the Game? (FanGraphs)", "url": "https://blogs.fangraphs.com/how-have-the-new-rules-changed-the-game"}], "status": "not_started"}, {"id": "fielding_run_value", "title": "Fielding Run Value (FRV)", "domain": "defense", "level": 4, "summary": "Statcast's all-in-one defensive run total: range (OAA at 0.9 runs per out in the OF, 0.75 in the IF), arm, double plays (0.4), first-base receiving (added 2026), and for catchers framing, blocking, throwing and, since 2026, ABS challenges.", "prerequisites": ["outs_above_average", "fielder_arm_value", "catcher_framing", "catcher_blocking", "catcher_throwing", "abs_challenge_value", "linear_weights", "statcast_data"], "sources": [{"title": "MLB Glossary - Fielding Run Value", "url": "https://www.mlb.com/glossary/statcast/fielding-run-value"}, {"title": "Baseball Savant changelog - First base receiving / scoops (2026)", "url": "https://baseballsavant.mlb.com/changelog/2026-08-21-first-base-receiving-scoops"}, {"title": "MLB Glossary - Outs Above Average", "url": "https://www.mlb.com/glossary/statcast/outs-above-average"}, {"title": "FanGraphs - A FanGraphs WAR Fielding Update (OAA in fWAR, 2022)", "url": "https://blogs.fangraphs.com/a-fangraphs-war-fielding-update"}], "status": "not_started"}, {"id": "in_game_tactics", "title": "In-game tactics by run and win expectancy", "domain": "strategy", "level": 2, "summary": "Use run and win expectancy tables to compute break-even success rates for stolen bases, sacrifice bunts, intentional walks and sending runners, with Savant's Game Strategy Explorer (April 2026) as the public reference implementation.", "prerequisites": ["run_expectancy", "win_expectancy"], "sources": [{"title": "Baseball Savant changelog: Game Strategy Explorer", "url": "https://baseballsavant.mlb.com/changelog/2026-04-17-game-strategy-explorer"}, {"title": "Mitchel Lichtman, When to walk (Part 1) (The Hardball Times, 2008)", "url": "https://tht.fangraphs.com/when-to-walk-part-1/"}], "status": "not_started"}, {"id": "lineup_optimization", "title": "Lineup Optimization", "domain": "strategy", "level": 3, "summary": "Using run-expectancy/Markov or simulation models to order hitters (best hitters at 1, 2 and 4, high-OBP hitters ahead of power); the optimal order is worth roughly 5 to 15 runs per season over a typical one.", "prerequisites": ["run_expectancy", "platoon_splits", "simulation_markov"], "sources": [{"title": "How Significant Is Batting Order? (FanGraphs, 2011)", "url": "https://blogs.fangraphs.com/how-significant-is-batting-order"}, {"title": "Optimizing Your Lineup By The Book (Beyond the Box Score)", "url": "https://www.beyondtheboxscore.com/2009/3/17/795946/optimizing-your-lineup-by"}], "status": "not_started"}, {"id": "platoon_splits", "title": "Platoon Splits and Platoon Skill Estimation", "domain": "strategy", "level": 3, "summary": "Same-hand vs opposite-hand performance gaps are mostly noise; estimating individual platoon skill by shrinking observed splits toward handedness-specific league means with large regression constants (~1000 PA vs LHP for LHB, ~2200 for RHB per The Book).", "prerequisites": ["woba", "bayesian_shrinkage", "reliability_stabilization"], "sources": [{"title": "FanGraphs: Estimating Hitter Platoon Skill (Klaassen, 2010)", "url": "https://blogs.fangraphs.com/estimating-hitter-platoon-skill"}, {"title": "THT: Platooning - the meaning of mean (Part 1)", "url": "https://tht.fangraphs.com/platooning-the-meaning-of-mean-part-1"}], "status": "not_started"}, {"id": "bullpen_leverage_deployment", "title": "Bullpen Usage, Leverage and Pitching Changes", "domain": "strategy", "level": 4, "summary": "Matching reliever quality to leverage over a season (getting pLI above gmLI, not holding relievers for save situations), traded off against fatigue and availability, the times-through-order penalty and platoon matchups when deciding when to pull a pitcher.", "prerequisites": ["leverage_index", "times_through_order", "platoon_splits"], "sources": [{"title": "Reliever Usage Redux - A Follow-Up (FanGraphs, 2012)", "url": "https://blogs.fangraphs.com/reliever-usage-redux-a-follow-up"}, {"title": "Baseball managers are getting smarter about handling their bullpens (FiveThirtyEight)", "url": "https://fivethirtyeight.com/features/baseball-managers-are-getting-smarter-about-handling-their-bullpens/"}], "status": "not_started"}, {"id": "times_through_order", "title": "Times-through-the-order penalty", "domain": "strategy", "level": 4, "summary": "Bayesian multinomial modeling that adjusts for batter and pitcher quality finds the TTOP is mostly a gradual within-game decline, not a jump at each new trip through the order, which matters for when to pull a starter.", "prerequisites": ["workload_fatigue", "bayesian_shrinkage", "woba", "mixed_models", "selection_bias_causal"], "sources": [{"title": "Brill, Deshpande & Wyner - A Bayesian analysis of the time through the order penalty (JQAS 2023 / arXiv)", "url": "https://arxiv.org/abs/2210.06724"}, {"title": "Baseball Prospectus - The Fourth Time Through and Exertion Levels", "url": "https://baseballprospectus.com/news/article/64243/the-fourth-time-through-and-exertion-levels"}, {"title": "A Bayesian analysis of the time through the order penalty (Brill, Deshpande, Wyner)", "url": "https://arxiv.org/pdf/2210.06724"}, {"title": "The Times Through the Order Penalty Is Worse Than You Thought, Part 1 (BP, 2021)", "url": "https://www.baseballprospectus.com/news/article/64499/veteran-presence-the-times-through-the-order-penalty-is-worse-than-you-thought-part-1/"}], "status": "not_started"}, {"id": "abs_challenge_strategy", "title": "ABS Challenge Timing and Budget Strategy", "domain": "strategy", "level": 5, "summary": "Treating the two-challenge budget as an option: the threshold for a challenge depends on overturn probability, the RE/WE swing (full counts and late, high-leverage spots are worth more), challenges remaining and innings left, and who is challenging (catchers win most often, pitchers least).", "prerequisites": ["abs_challenge_value", "leverage_index", "win_expectancy", "in_game_tactics"], "sources": [{"title": "Baseball Savant - ABS Metrics Documentation", "url": "https://baseballsavant.mlb.com/abs-metrics-documentation"}, {"title": "ABS challenge system results - what we have learned (MLB.com, Apr 2026)", "url": "https://www.mlb.com/news/abs-challenge-system-results-what-we-have-learned"}, {"title": "ABS challenge strategy (CalledThird, Apr 2026)", "url": "https://calledthird.pages.dev/analysis/abs-challenge-strategy"}], "status": "not_started"}, {"id": "marcel_projections", "title": "Baseline projection systems (Marcel)", "domain": "valuation", "level": 2, "summary": "Build Marcel (5/4/3 weighted seasons, regression toward the mean, simple age adjustment) as the minimum-competence benchmark every projection system must beat.", "prerequisites": ["regression_to_mean"], "sources": [{"title": "Baseball-Reference - Marcel the Monkey Forecasting System", "url": "https://www.baseball-reference.com:443/about/marcels.shtml"}, {"title": "MLB Glossary - Marcel", "url": "https://www.mlb.com/glossary/projection-systems/marcel-the-monkey-forecasting-system"}, {"title": "Behind the Monkey (FanGraphs)", "url": "https://blogs.fangraphs.com/index.php/behind-the-monkey/"}, {"title": "Marcel is Magnifique (THT)", "url": "https://tht.fangraphs.com/tht-live/marcel-is-magnifique/"}], "status": "not_started"}, {"id": "aging_curves", "title": "Aging curves via the delta method", "domain": "valuation", "level": 3, "summary": "Build aging curves by chaining harmonic-mean-weighted year-over-year changes for players observed in consecutive seasons, and understand what that conditioning implies.", "prerequisites": ["regression_to_mean", "woba"], "sources": [{"title": "The Hardball Times - How Do Baseball Players Age? (Part 2)", "url": "https://tht.fangraphs.com/how-do-baseball-players-age-part-2/"}, {"title": "Schuckers et al. - Estimating player age curves using regression and imputation", "url": "https://arxiv.org/pdf/2110.14017"}, {"title": "Are Aging Curves Changing? (FanGraphs, 2013)", "url": "https://blogs.fangraphs.com/hitters-no-longer-peak-only-decline"}, {"title": "Maybe Players Aren't Aging Differently After All (THT)", "url": "https://tht.fangraphs.com/maybe-players-arent-aging-differently-after-all/"}], "status": "not_started"}, {"id": "amateur_minor_league_data", "title": "Minor-league and amateur tracking data", "domain": "valuation", "level": 3, "summary": "What tracking
