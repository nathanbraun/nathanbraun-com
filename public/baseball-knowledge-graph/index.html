data exists below MLB (Hawk-Eye Statcast for all of Triple-A since 2023 and the Florida State League; college TrackMan and summer-league feeds are mostly private) and how to translate it, since draft and prospect models are built on this data rather than MLB data.", "prerequisites": ["statcast_data", "minor_league_equivalencies"], "sources": [{"title": "MLB.com: Statcast data on prospects? Yes, please", "url": "https://www.mlb.com/news/minor-league-statcast-data"}, {"title": "Pifer, Optical Tracking Data from College Baseball Scrimmages (Mendeley, 2024)", "url": "https://data.mendeley.com/datasets/xfnz6mkdzm"}], "status": "not_started"}, {"id": "cba_roster_mechanics", "title": "CBA, service time and roster mechanics", "domain": "valuation", "level": 3, "summary": "Service time and arbitration eligibility, minor-league options and the 40-man and Rule 5 calendar, the competitive-balance tax, qualifying offers and draft bonus pools. The current CBA expires December 1, 2026, so every surplus-value number rests on rules that may change.", "prerequisites": ["replacement_level"], "sources": [{"title": "ESPN: What you need to know about MLB's looming labor battle", "url": "https://www.espn.com/mlb/story/_/id/47108752/"}, {"title": "MLB Trade Rumors: Projected arbitration salaries for 2026", "url": "https://www.mlbtraderumors.com/2025/10/projected-arbitration-salaries-for-2026"}], "status": "not_started"}, {"id": "minor_league_equivalencies", "title": "Minor League Equivalencies (MLEs)", "domain": "valuation", "level": 3, "summary": "Translating minor-league stats to an MLB scale by adjusting for park and run environment, then estimating level-to-level talent gaps from players who move mid-season, chained up the ladder; an MLE re-expresses performance and is not a projection by itself.", "prerequisites": ["linear_weights", "regression_to_mean", "aging_curves"], "sources": [{"title": "FanGraphs Library - League Equivalencies", "url": "https://library.fangraphs.com/principles/league-equivalencies"}, {"title": "A Theoretical Blueprint for Improving MLEs (THT)", "url": "https://tht.fangraphs.com/a-theoretical-blueprint-for-improving-mles/"}, {"title": "Creating a Projection for Munetaka Murakami (FanGraphs, Dec 2025)", "url": "https://blogs.fangraphs.com/creating-a-projection-for-munetaka-murakami"}, {"title": "Board Update - International Professional Players (FanGraphs)", "url": "https://blogs.fangraphs.com/board-update-international-professional-players"}], "status": "not_started"}, {"id": "aging_survivor_bias", "title": "Survivor bias and missing-data corrections in aging", "domain": "valuation", "level": 4, "summary": "Treat players who drop out as missing-not-at-random data and correct with imputation or mixed models; corrected curves peak earlier (about 26 rather than 30 in Nguyen-Matthews).", "prerequisites": ["aging_curves", "mixed_models"], "sources": [{"title": "Nguyen & Matthews - Filling the Gaps, multiple imputation aging curves (JSA 2024)", "url": "https://arxiv.org/pdf/2210.02383"}, {"title": "Schuckers et al. - Estimating player age curves using regression and imputation", "url": "https://arxiv.org/pdf/2110.14017"}], "status": "not_started"}, {"id": "dollars_per_war", "title": "Dollars per WAR and the Free-Agent Market", "domain": "valuation", "level": 4, "summary": "Market price of a projected win, backed out from free-agent contracts using projected WAR, an aging decline and inflation; about $11M per WAR in 2025-26, and convex, since stars get more per win than role players.", "prerequisites": ["war_framework", "projection_systems"], "sources": [{"title": "What Are Teams Paying For A Win In Free Agency? 2026 Edition (FanGraphs)", "url": "https://blogs.fangraphs.com/what-are-teams-paying-for-a-win-in-free-agency-2026-edition"}], "status": "not_started"}, {"id": "draft_pick_valuation", "title": "Draft Pick and Draft Model Valuation", "domain": "valuation", "level": 4, "summary": "Expected surplus by pick slot from historical WAR (smoothed across slots, discounted, net of slot bonus, medians in late rounds), plus team draft models that combine amateur stats, tracking data and scouting to rank players against that curve under the bonus pool.", "prerequisites": ["prospect_valuation", "cba_roster_mechanics", "amateur_minor_league_data"], "sources": [{"title": "An Update on How to Value Draft Picks (FanGraphs, 2019)", "url": "https://blogs.fangraphs.com/an-update-on-how-to-value-draft-picks"}, {"title": "Major League Draft WARs (Journal of Sports Analytics)", "url": "https://content.iospress.com:443/articles/journal-of-sports-analytics/jsa200586"}], "status": "not_started"}, {"id": "injury_risk_playing_time", "title": "Injury Risk and Playing-Time Projection", "domain": "valuation", "level": 4, "summary": "Projecting games or PA as a distribution (IL probability, workload, pitcher UCL risk) and valuing missed time at the replacement-level fill-in rather than at zero.", "prerequisites": ["projection_systems", "war_framework"], "sources": [{"title": "Properly Valuing Hitters with Injury Risk (THT, 2016)", "url": "https://tht.fangraphs.com/properly-valuing-hitters-with-injury-risk"}, {"title": "Predicting UCL Injury in Rookie MLB Pitchers (arXiv)", "url": "https://arxiv.org/pdf/2207.00585"}], "status": "not_started"}, {"id": "projection_systems", "title": "Modern Projection Systems (Steamer, ZiPS, PECOTA, THE BAT X, OOPSY, ATC)", "domain": "valuation", "level": 4, "summary": "Production forecasts that build on Marcel with component-level regression, comparable players (PECOTA, ZiPS), Statcast inputs (THE BAT X), MLE and international translations, percentile distributions and ensembles (ATC, FanGraphs Depth Charts as a Steamer/ZiPS blend).", "prerequisites": ["marcel_projections", "bayesian_shrinkage", "batted_ball_quality", "minor_league_equivalencies"], "sources": [{"title": "All the 2026 Projections Are In (FanGraphs, Jan 2026)", "url": "https://blogs.fangraphs.com/all-the-2026-projections-are-in"}, {"title": "MLB Glossary - PECOTA", "url": "https://www.mlb.com/glossary/projection-systems/player-empirical-comparison-and-optimization-test-algorithm"}], "status": "not_started"}, {"id": "prospect_valuation", "title": "Prospect Valuation (FV Grades to Surplus)", "domain": "valuation", "level": 4, "summary": "Mapping scouting Future Value grades and statistical performance (MLEs, age for level) to distributions of MLB WAR, then to control-adjusted, discounted surplus; position players carry less risk than pitchers at the same grade.", "prerequisites": ["surplus_value", "minor_league_equivalencies", "projection_systems", "amateur_minor_league_data"], "sources": [{"title": "An Update to Prospect Valuation (FanGraphs, 2018)", "url": "https://blogs.fangraphs.com/an-update-to-prospect-valuation"}, {"title": "How Do Prospect Grades Translate to Future Outcomes? (FanGraphs)", "url": "https://blogs.fangraphs.com/how-do-prospect-grades-translate-to-future-outcomes"}], "status": "not_started"}, {"id": "surplus_value", "title": "Contract Surplus Value", "domain": "valuation", "level": 4, "summary": "Present value of projected WAR times $/WAR (with aging, injury-adjusted playing time and discounting) minus expected salary across the years of control; the core unit for comparing contracts and trade assets.", "prerequisites": ["dollars_per_war", "aging_curves", "injury_risk_playing_time", "war_framework", "cba_roster_mechanics"], "sources": [{"title": "What Are Teams Paying For A Win In Free Agency? 2026 Edition (FanGraphs)", "url": "https://blogs.fangraphs.com/what-are-teams-paying-for-a-win-in-free-agency-2026-edition"}, {"title": "An Update to Prospect Valuation (FanGraphs, 2018)", "url": "https://blogs.fangraphs.com/an-update-to-prospect-valuation"}, {"title": "Modeling Salary Arbitration - Introduction (FanGraphs, 2015)", "url": "https://blogs.fangraphs.com/modeling-salary-arbitration-introduction"}, {"title": "Projected Arbitration Salaries for 2026 (MLBTR)", "url": "https://www.mlbtraderumors.com/2025/10/projected-arbitration-salaries-for-2026"}], "status": "not_started"}, {"id": "trade_valuation", "title": "Trade Valuation", "domain": "valuation", "level": 4, "summary": "Comparing packages by surplus value, years of control, risk and the team-specific value of wins now vs. later (deadline rentals vs. prospects); FanGraphs' 2026 Trade Value series shows how the market weights control, age and star premiums.", "prerequisites": ["surplus_value", "prospect_valuation", "war_framework", "dollars_per_war"], "sources": [{"title": "2026 Trade Value - Introduction and Honorable Mentions (FanGraphs)", "url": "https://blogs.fangraphs.com/2026-trade-value-introduction-and-honorable-mentions"}, {"title": "Valuing Midseason Trade Targets (FanGraphs)", "url": "https://blogs.fangraphs.com/valuing-midseason-trade-targets"}, {"title": "Win Curves and Player Pricing (FanGraphs, 2012)", "url": "https://blogs.fangraphs.com/win-curves-and-player-pricing/"}, {"title": "Rethinking the Win Curve (THT)", "url": "https://tht.fangraphs.com/rethinking-the-win-curve/"}], "status": "not_started"}, {"id": "roster_optimization", "title": "Team-Level Roster Optimization", "domain": "valuation", "level": 5, "summary": "Choosing a 26/40-man roster and payroll to maximize championship odds over a planning horizon, by simulating seasons from correlated projection distributions (offense, FRV, platoons, bullpen depth, injury) under budget, roster and option constraints.", "prerequisites": ["trade_valuation", "fielding_run_value", "bullpen_leverage_deployment", "lineup_optimization", "injury_risk_playing_time", "simulation_markov", "cba_roster_mechanics"], "sources": [{"title": "Win Curves and Player Pricing (FanGraphs, 2012)", "url": "https://blogs.fangraphs.com/win-curves-and-player-pricing/"}, {"title": "What Are Teams Paying For A Win In Free Agency? 2026 Edition (FanGraphs)", "url": "https://blogs.fangraphs.com/what-are-teams-paying-for-a-win-in-free-agency-2026-edition"}], "status": "not_started"}]};
const KEY = "kg-status:" + GRAPH.meta.title;
const LEVELS = [
  [1, "Foundations"], [2, "Core"], [3, "Working analyst"], [4, "Advanced"], [5, "Frontier"],
];
const NAMES = { mastered: "Mastered", in_progress: "In progress", available: "Ready to learn", locked: "Locked" };

const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const byId = Object.fromEntries(GRAPH.nodes.map(n => [n.id, n]));
const dependents = {};
GRAPH.nodes.forEach(n => (n.prerequisites || []).forEach(p => (dependents[p] ||= []).push(n.id)));

let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { overrides = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(overrides)); } catch (e) {} }

function baseStatus(id) {
  const s = overrides[id] || byId[id].status;
  return s === "mastered" || s === "in_progress" ? s : "not_started";
}
function state(id) {
  const s = baseStatus(id);
  if (s !== "not_started") return s;
  return (byId[id].prerequisites || []).every(p => baseStatus(p) === "mastered") ? "available" : "locked";
}
function ancestors(id, acc = new Set()) {
  (byId[id].prerequisites || []).forEach(p => { if (!acc.has(p)) { acc.add(p); ancestors(p, acc); } });
  return acc;
}

let selected = null, query = "", statusFilter = null;

function renderTally() {
  const counts = { mastered: 0, in_progress: 0, available: 0, locked: 0 };
  GRAPH.nodes.forEach(n => counts[state(n.id)]++);
  const el = document.getElementById("tally");
  el.innerHTML = "";
  Object.keys(counts).forEach(k => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", statusFilter === k);
    b.innerHTML = `<i class="dia ${k === "locked" ? "" : k}"></i>${NAMES[k]} <b>${counts[k]}</b>`;
    b.onclick = () => { statusFilter = statusFilter === k ? null : k; renderAll(); };
    el.appendChild(b);
  });
}

function matches(n) {
  if (statusFilter && state(n.id) !== statusFilter) return false;
  if (!query) return true;
  const hay = (n.title + " " + n.summary + " " + n.id).toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function renderGrid() {
  const anc = selected ? ancestors(selected) : new Set();
  const deps = new Set(selected ? dependents[selected] || [] : []);
  const t = document.getElementById("grid");
  let html = "<thead><tr><th>Domain</th>" + LEVELS.map(([l, name]) => `<th>Level ${l}<span>${name}</span></th>`).join("") + "</tr></thead><tbody>";
  GRAPH.domains.forEach(d => {
    const ns = GRAPH.nodes.filter(n => n.domain === d.id);
    html += `<tr><th>${esc(d.title)}<small>${ns.length} topics</small></th>`;
    LEVELS.forEach(([l]) => {
      html += '<td><div class="cell">';
      ns.filter(n => n.level === l).sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
        const st = state(n.id);
        const cls = ["chip", st === "locked" ? "locked" : "",
          !matches(n) ? "dim" : "",
          n.id === selected ? "selected" : "",
          anc.has(n.id) ? "ancestor" : "",
          deps.has(n.id) ? "dependent" : ""].join(" ");
        html += `<button class="${cls}" data-id="${n.id}" title="${NAMES[st]}"><i class="dia ${st === "locked" ? "" : st}"></i><span>${esc(n.title)}</span></button>`;
      });
      html += "</div></td>";
    });
    html += "</tr>";
  });
  t.innerHTML = html + "</tbody>";
  t.querySelectorAll(".chip").forEach(b => b.onclick = () => select(b.dataset.id));
}

function linkList(ids) {
  if (!ids.length) return '<span class="none">None</span>';
  return ids.map(id => `<button data-id="${id}"><i class="dia ${state(id) === "locked" ? "" : state(id)}"></i>${esc(byId[id].title)}</button>`).join("");
}

function renderDetail() {
  const el = document.getElementById("detail");
  if (!selected) {
    const ready = GRAPH.nodes.filter(n => state(n.id) === "available").sort((a, b) => a.level - b.level).slice(0, 8);
    el.innerHTML = `<div class="eyebrow">${GRAPH.nodes.length} topics · ${GRAPH.meta.updated || ""}</div>
      <h2>Where to start</h2>
      <p>Mark what you already know as mastered and the graph unlocks what comes next. These are ready now:</p>
      <div class="links">${linkList(ready.map(n => n.id))}</div>
      <div class="row"><button class="ghost" id="copy">Copy progress</button><button class="ghost" id="reset">Clear my marks</button></div>
      <p class="note" id="copynote">Progress is saved in this browser. Copy it to paste back into the graph file.</p>`;
  } else {
    const n = byId[selected];
    const dom = GRAPH.domains.find(d => d.id === n.domain).title;
    const st = baseStatus(n.id);
    el.innerHTML = `<div class="eyebrow">${dom} · Level ${n.level} · ${n.id}</div>
      <h2>${esc(n.title)}</h2>
      <p>${esc(n.summary)}</p>
      <div><h3>Status</h3><div class="status-set">
        ${[["not_started", "Not started"], ["in_progress", "In progress"], ["mastered", "Mastered"]].map(([k, l]) =>
          `<button data-status="${k}" aria-pressed="${st === k}">${l}</button>`).join("")}
      </div></div>
      <div><h3>Requires</h3><div class="links">${linkList(n.prerequisites || [])}</div></div>
      <div><h3>Unlocks</h3><div class="links">${linkList(dependents[n.id] || [])}</div></div>
      <div><h3>Sources</h3>${(n.sources || []).length ? `<ol class="sources">${n.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join("")}</ol>` : '<span class="empty">None listed</span>'}</div>
      <div class="row"><button class="ghost" id="close">Back to overview</button></div>`;
    el.querySelectorAll("[data-status]").forEach(b => b.onclick = () => {
      if (b.dataset.status === (n.status || "not_started")) delete overrides[n.id]; else overrides[n.id] = b.dataset.status;
      save(); renderAll();
    });
    el.querySelector("#close").onclick = () => select(null);
  }
  el.querySelectorAll(".links button").forEach(b => b.onclick = () => select(b.dataset.id));
  const copy = el.querySelector("#copy");
  if (copy) copy.onclick = () => {
    const out = {};
    GRAPH.nodes.forEach(n => { const s = baseStatus(n.id); if (s !== "not_started") out[n.id] = s; });
    const text = JSON.stringify(out, null, 2);
    const note = el.querySelector("#copynote");
    navigator.clipboard.writeText(text).then(() => note.textContent = "Copied " + Object.keys(out).length + " marked topics.")
      .catch(() => { note.textContent = text; });
  };
  const reset = el.querySelector("#reset");
  if (reset) reset.onclick = () => {
    if (reset.dataset.armed) { overrides = {}; save(); renderAll(); }
    else { reset.dataset.armed = "1"; reset.textContent = "Click again to clear"; }
  };
}

const W = 1240, H = 820, PADL = 150, PADT = 44;
let view = "grid", mapBuilt = false, mapSel = null;
try { if (localStorage.getItem(KEY + ":view") === "map") view = "map"; } catch (e) {}

function buildMap() {
  if (mapBuilt || typeof d3 === "undefined") return;
  mapBuilt = true;
  const doms = GRAPH.domains.map(d => d.id);
  const bandH = (H - PADT) / doms.length;
  const levelX = l => PADL + 40 + (l - 1) * (W - PADL - 120) / 4;
  const bandY = d => PADT + (doms.indexOf(d) + 0.5) * bandH;
  const sn = GRAPH.nodes.map(n => ({ id: n.id, level: n.level, domain: n.domain, x: levelX(n.level), y: bandY(n.domain) }));
  const links = [];
  GRAPH.nodes.forEach(n => (n.prerequisites || []).forEach(p => links.push({ source: p, target: n.id })));
  const sim = d3.forceSimulation(sn)
    .force("link", d3.forceLink(links).id(d => d.id).distance(40).strength(0.08))
    .force("x", d3.forceX(d => levelX(d.level)).strength(0.7))
    .force("y", d3.forceY(d => bandY(d.domain)).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-26))
    .force("collide", d3.forceCollide(12))
    .stop();
  for (let i = 0; i < 400; i++) sim.tick();
  sn.forEach(d => {
    const top = PADT + doms.indexOf(d.domain) * bandH;
    d.y = Math.max(top + 12, Math.min(top + bandH - 12, d.y));
    d.x = Math.max(PADL + 10, Math.min(W - 10, d.x));
  });

  const svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
  const root = svg.append("g");
  doms.forEach((d, i) => {
    if (i % 2 === 0) root.append("rect").attr("class", "band").attr("x", 0).attr("y", PADT + i * bandH).attr("width", W).attr("height", bandH);
    root.append("text").attr("class", "axis").attr("x", 12).attr("y", PADT + (i + 0.5) * bandH + 4)
      .text(GRAPH.domains[i].title.split(/[,&]/)[0].trim());
  });
  LEVELS.forEach(([l, name]) => root.append("text").attr("class", "axis").attr("x", levelX(l)).attr("y", 26)
    .attr("text-anchor", "middle").text(`L${l} ${name}`));
  root.append("g").selectAll("line").data(links).join("line").attr("class", "edge")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  const g = root.append("g").selectAll("g").data(sn).join("g").attr("class", "node")
    .attr("transform", d => `translate(${d.x},${d.y})`).attr("tabindex", 0)
    .on("click", (e, d) => { e.stopPropagation(); select(d.id); })
    .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(d.id); } });
  g.append("circle").attr("r", d => 5 + d.level);
  g.append("title").text(d => byId[d.id].title);
  g.append("text").attr("x", d => 8 + d.level).attr("y", 4).text(d => byId[d.id].title);
  svg.on("click", () => select(null));
  svg.call(d3.zoom().scaleExtent([0.6, 5]).on("zoom", e => root.attr("transform", e.transform)));
  mapSel = { links, g, edges: root.selectAll(".edge") };

  const leg = document.getElementById("dlegend");
  leg.innerHTML = GRAPH.domains.map((d, i) => `<span><i style="background:var(--d${i + 1})"></i>${esc(d.title)}</span>`).join("");
}

function renderMap() {
  buildMap();
  if (!mapSel) return;
  const anc = selected ? ancestors(selected) : new Set();
  const deps = new Set(selected ? dependents[selected] || [] : []);
  const doms = GRAPH.domains.map(d => d.id);
  mapSel.g.each(function (d) {
    const n = byId[d.id], st = state(d.id), col = `var(--d${doms.indexOf(n.domain) + 1})`;
    const lit = d.id === selected || anc.has(d.id) || deps.has(d.id);
    this.setAttribute("class", ["node", st, !matches(n) ? "dim" : "", selected && !lit ? "faded" : "",
      d.id === selected ? "selected" : "", lit ? "lit" : ""].join(" "));
    const c = this.querySelector("circle");
    c.style.stroke = col;
    c.style.fill = st === "mastered" ? col : st === "in_progress" ? `color-mix(in srgb, ${col} 45%, var(--card))` : "";
  });
  mapSel.edges.each(function (e) {
    const s = e.source.id, t = e.target.id;
    const isAnc = selected && (t === selected || anc.has(t)) && anc.has(s);
    const isDep = selected && s === selected && deps.has(t);
    this.setAttribute("class", ["edge", isAnc ? "anc" : "", isDep ? "dep" : "", selected && !isAnc && !isDep ? "faded" : ""].join(" "));
  });
}

function setView(v) {
  view = v;
  try { localStorage.setItem(KEY + ":view", v); } catch (e) {}
  document.getElementById("tab-grid").setAttribute("aria-selected", v === "grid");
  document.getElementById("tab-map").setAttribute("aria-selected", v === "map");
  document.getElementById("gridwrap").hidden = v !== "grid";
  document.getElementById("mapwrap").hidden = v !== "map";
  document.getElementById("dlegend").hidden = v !== "map";
  renderAll();
}
document.getElementById("tab-grid").onclick = () => setView("grid");
document.getElementById("tab-map").onclick = () => setView("map");

function select(id) { selected = id; renderAll(); }
function renderAll() { renderTally(); if (view === "grid") renderGrid(); else renderMap(); renderDetail(); }

document.getElementById("title").textContent = GRAPH.meta.title;
document.getElementById("desc").textContent = GRAPH.meta.description;
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); view === "grid" ? renderGrid() : renderMap(); });
setView(view);
</script>
